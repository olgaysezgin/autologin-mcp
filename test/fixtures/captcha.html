<!doctype html>
<html>
<head><meta charset="utf-8"><title>Captcha before the login</title></head>
<body>
  <!-- A captcha challenge shown before the login form (the frame address is what matters, not its content). -->
  <main>
    <p>Please confirm you are a person.</p>
    <iframe title="reCAPTCHA" width="304" height="78" src="/recaptcha/api2/anchor?k=test-key&size=normal"></iframe>
  </main>
</body>
</html>
