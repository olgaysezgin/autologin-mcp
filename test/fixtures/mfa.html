<!doctype html>
<html>
<head><meta charset="utf-8"><title>Password, then a one-time code</title></head>
<body>
  <!-- After a correct password the app asks for an authenticator code: a second factor a person enters. -->
  <div id="login">
    <input id="user" type="email" name="email" autocomplete="username">
    <input id="pass" type="password" name="password" autocomplete="current-password">
    <div role="button" id="go" tabindex="0">Log in</div>
    <p id="err" class="error" style="display:none"></p>
  </div>
  <script>
    document.getElementById('go').addEventListener('click', async () => {
      const body = JSON.stringify({ username: document.getElementById('user').value, password: document.getElementById('pass').value });
      const res = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body });
      if (res.ok) {
        document.getElementById('login').innerHTML =
          '<label>Code from your authenticator app <input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code"></label><button>Verify</button>';
      } else {
        const err = document.getElementById('err');
        err.textContent = 'Invalid credentials';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
