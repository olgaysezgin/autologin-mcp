<!doctype html>
<html>
<head><meta charset="utf-8"><title>Password, then an authenticator code</title></head>
<body>
  <!-- After a correct password the app asks for the code from an authenticator app and checks it on the server. -->
  <div id="login">
    <input id="user" type="email" name="email" autocomplete="username">
    <input id="pass" type="password" name="password" autocomplete="current-password">
    <div role="button" id="go" tabindex="0">Log in</div>
    <p id="err" class="error" style="display:none"></p>
  </div>
  <script>
    const showError = (text) => {
      const err = document.getElementById('err');
      err.textContent = text;
      err.style.display = 'block';
    };
    document.getElementById('go').addEventListener('click', async () => {
      const body = JSON.stringify({ username: document.getElementById('user').value, password: document.getElementById('pass').value });
      const res = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body });
      if (!res.ok) return showError('Invalid credentials');
      document.getElementById('login').innerHTML =
        '<form id="code-form"><label>Code from your authenticator app <input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code"></label>' +
        '<button type="submit">Verify</button></form><p id="err" class="error" style="display:none"></p>';
      document.getElementById('code-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const check = await fetch('/api/totp', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code: document.getElementById('otp').value }) });
        if (check.ok) document.body.innerHTML = '<nav id="menu">Signed in</nav>';
        else showError('That code is not valid');
      });
    });
  </script>
</body>
</html>
