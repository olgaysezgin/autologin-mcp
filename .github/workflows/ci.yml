name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: npm ci
      - run: npm run typecheck
      - name: llms-full.txt is up to date
        run: node scripts/build-llms.mjs --check
      - name: One version in package.json, git tags, npm, CHANGELOG, docs and website
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/release.mjs check
      - name: Tests with coverage (fails below 98%)
        run: npm run coverage
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run build
      - run: npm run smoke
