name: Release

# Publishes to npm only from a tag v<version> that matches package.json and is on main,
# then creates the GitHub release with the CHANGELOG.md section of that version
# and publishes server.json to the official MCP Registry.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: npm ci
      - name: Tag, package.json, CHANGELOG, docs and npm agree
        run: node scripts/release.mjs verify-tag
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs notes > "$RUNNER_TEMP/notes.md"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "autologin-mcp ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"

  # Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
  # The registry checks that the npm package of this version carries the same mcpName.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # MCP Registry login with GitHub OIDC, no secret needed
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - uses: actions/checkout@v4
      - name: Wait until npm serves this version with its mcpName
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="$(node -p "require('./package.json').mcpName")"
          for attempt in $(seq 30); do
            [ "$(npm view "autologin-mcp@$version" mcpName 2>/dev/null)" = "$expected" ] && exit 0
            sleep 10
          done
          echo "npm does not show autologin-mcp@$version with mcpName $expected" >&2
          exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
